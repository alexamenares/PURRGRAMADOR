      border-radius: 10px; background: light-dark(#e8f8ff, #102f47); color: var(--ink);
    }
    #purrgramadorMvpPresentacion .footer {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      padding: 13px 24px; color: var(--muted); font-size: 12px;
      background: light-dark(#fbfdff, #081b2c); border-top: 1px solid var(--line);
    }
    #purrgramadorMvpPresentacion .footer a { color: var(--blue); text-decoration: none; font-weight: 500; }
    #purrgramadorMvpPresentacion .footer a:hover { text-decoration: underline; }
    @media (max-width: 760px) {
      #purrgramadorMvpPresentacion .topbar { grid-template-columns: 1fr auto; gap: 12px; padding: 12px 15px; }
      #purrgramadorMvpPresentacion .search { grid-column: 1 / -1; grid-row: 2; max-width: none; }
      #purrgramadorMvpPresentacion .nav { justify-content: flex-start; padding: 7px 10px; }
      #purrgramadorMvpPresentacion .nav button { padding: 0 11px; }
      #purrgramadorMvpPresentacion .hero { grid-template-columns: 1fr 145px; gap: 12px; }
      #purrgramadorMvpPresentacion .hero-logo { width: 140px; min-height: 160px; }
      #purrgramadorMvpPresentacion .mission-layout { grid-template-columns: 1fr; }
      #purrgramadorMvpPresentacion .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 500px) {
      #purrgramadorMvpPresentacion main { padding: 19px 14px 26px; }
      #purrgramadorMvpPresentacion .hero { grid-template-columns: 1fr; min-height: 0; }
      #purrgramadorMvpPresentacion .hero-logo { display: none; }
      #purrgramadorMvpPresentacion .grid { grid-template-columns: 1fr; }
      #purrgramadorMvpPresentacion .profile-facts { grid-template-columns: 1fr; }
      #purrgramadorMvpPresentacion .footer { padding: 13px 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #purrgramadorMvpPresentacion *, #purrgramadorMvpPresentacion *:before, #purrgramadorMvpPresentacion *:after {
        transition-duration: .01ms !important; scroll-behavior: auto !important;
      }
    }
    #purrgramadorMvpPresentacion .resource-tags,
    #purrgramadorMvpPresentacion .filters {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px;
    }
    #purrgramadorMvpPresentacion .resource-tags span {
      padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--surface); color: var(--ink);
    }
    #purrgramadorMvpPresentacion .resource-note { margin: 12px 0 0; }
    #purrgramadorMvpPresentacion .filters button {
      padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--muted); cursor: pointer;
    }
    #purrgramadorMvpPresentacion .filters button[aria-pressed=&quot;true&quot;] {
      color: light-dark(#075b87, #d1f4ff); border-color: #5bcdf5;
      background: light-dark(#e6f8ff, #10364f);
    }
    #purrgramadorMvpPresentacion .op-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    #purrgramadorMvpPresentacion .op-card { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    #purrgramadorMvpPresentacion .op-card p { color: var(--muted); margin: 5px 0 10px; }
    #purrgramadorMvpPresentacion .text-button { border: 0; padding: 5px 0; background: transparent; color: var(--blue); font: inherit; font-weight: 500; text-decoration: none; cursor: pointer; }
    #purrgramadorMvpPresentacion .text-button:hover { text-decoration: underline; }
    #purrgramadorMvpPresentacion .character-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px; }
    #purrgramadorMvpPresentacion .character { padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    #purrgramadorMvpPresentacion .character h3 { margin-bottom: 3px; font-size: 14px; }
    #purrgramadorMvpPresentacion .character p { margin: 0; color: var(--muted); font-size: 12px; }
    #purrgramadorMvpPresentacion .content-share { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    #purrgramadorMvpPresentacion [hidden] { display: none !important; }
    @media (max-width: 760px) {
      #purrgramadorMvpPresentacion .character-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      #purrgramadorMvpPresentacion .op-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      #purrgramadorMvpPresentacion .character-grid { grid-template-columns: 1fr; }
      #purrgramadorMvpPresentacion .content-share { align-items: flex-start; flex-direction: column; }
    }

            &lt;div class=&quot;story-scene&quot;&gt;&lt;p&gt;El terminal de una estación dejó de mostrar mensajes. Para comprobar la conexión, escribe una instrucción que permita mostrar &lt;strong&gt;“Hola, mundo”&lt;/strong&gt; en pantalla.&lt;/p&gt;&lt;/div&gt;
